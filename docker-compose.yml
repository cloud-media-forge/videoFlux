version: '3.8'

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: videoflux-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Image Upload API
  videoFlux-upload-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoflux-upload-api
    ports:
      - "8081:8080"
    environment:
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=original-video
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config

  # Image Download API
  videoFlux-download-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoflux-download-api
    ports:
      - "8082:8080"
    environment:
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=original-video
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config

  # Image Admin UI
  videoFlux-admin-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoflux-admin-ui
    ports:
      - "8080:8080"
    environment:
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=original-video
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      minio:
        condition: service_healthy
      videoFlux-upload-api:
        condition: service_started
      videoFlux-download-api:
        condition: service_started
    volumes:
      - ./config:/app/config

volumes:
  minio-data:
    driver: local

networks:
  default:
    name: videoflux-network

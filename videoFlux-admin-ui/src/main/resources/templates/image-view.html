<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Image - Image Flux Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">Image Flux Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" th:text="'Welcome, ' + ${username}"></span>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action">Dashboard</a>
                    <a th:href="@{/admin/video}" class="list-group-item list-group-item-action active">My Images</a>
                    <a th:href="@{/admin/upload}" class="list-group-item list-group-item-action">Upload Image</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Image Details</h2>
                    <a th:href="@{/admin/video}" class="btn btn-secondary">Back to List</a>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        Image Preview
                    </div>
                    <div class="card-body text-center">
                        <!-- 显示完整图片 -->
                        <img th:src="@{'/api/v1/thumbnail/' + ${image.fileHash}}"
                             alt="Image" class="img-fluid" th:onerror="'this.src=\'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNjY2MiLz48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtc2l6ZT0iMTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM2NjYiPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg==\''">
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        Image Information
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <th>File Name:</th>
                                <td th:text="${image.fileName != null ? image.fileName : 'N/A'}">Filename</td>
                            </tr>
                            <tr>
                                <th>Dimensions:</th>
                                <td>
                                    <span th:text="${image.width != null ? image.width : 'N/A'}">Width</span> x 
                                    <span th:text="${image.height != null ? image.height : 'N/A'}">Height</span>
                                </td>
                            </tr>
                            <tr>
                                <th>File Size:</th>
                                <td th:text="${image.fileSize != null ? #numbers.formatDecimal(image.fileSize / 1024.0, 1, 2) + ' KB' : 'N/A'}">Size</td>
                            </tr>
                            <tr>
                                <th>Content Type:</th>
                                <td th:text="${image.contentType != null ? image.contentType : 'N/A'}">Content Type</td>
                            </tr>
                            <tr>
                                <th>Uploaded:</th>
                                <td th:text="${image.createdAt != null ? image.createdAt : 'N/A'}">Date</td>
                            </tr>
                            <tr>
                                <th>File Path:</th>
                                <td th:text="${image.filePath != null ? image.filePath : 'N/A'}">File Path</td>
                            </tr>
                        </table>
                        
                        <div class="mt-3">
                            <button class="btn btn-primary" disabled>Edit</button>
                            <button class="btn btn-danger" disabled>Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

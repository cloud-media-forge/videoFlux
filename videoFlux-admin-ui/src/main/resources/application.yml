server:
  port: 8082

spring:
  application:
    name: videoFlux-admin-ui
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    user:
      name: admin
      password: admin123
video-flux:
  # CDN configuration
  cdn:
    base-url: http://localhost:9001
    api-key: your-cdn-api-key

  # Image processing configuration
  image:
    max-size: 10485760 # 10MB in bytes
    supported-formats: JPG,JPEG,PNG,GIF,AVIF

  # GraphicsMagick configuration
  gm:
    pool-size: 16 # 默认值为16